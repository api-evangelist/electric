aid: electric
name: Electric
description: 'Electric (Electric AI) is an IT and security management platform for small and
  medium-sized businesses, consolidating device management, application and SaaS management, security
  posture monitoring with automatic remediation, and employee onboarding/offboarding into a single
  platform that requires no in-house IT skills and syncs with HR systems. Founded in New York and
  backed by Bessemer Venture Partners, Electric bundles partner tooling (JumpCloud MDM/SSO, Keeper,
  ThreatDown, Harmony Email, Perimeter81 VPN, Drata) behind an AI-powered IT Hub, help desk, and
  hardware procurement service. It is not a developer-API company: there is no public developer
  portal, API reference, or SDKs at this time. This profile was surfaced as a Bessemer portfolio
  company and enriched from Electric''s public web surface.'
